name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 0.1.0 ships for Windows only; Linux and macOS join once their GUI tests are made portable
        os: [windows-latest]
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      AEROLUME_TEST_NO_GL: "1"        # hosted runners have no GPU; 3D view tests skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU PyTorch
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            pip install torch
          else
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install Aerolume
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (fast suite)
        run: pytest -v --tb=short -rfE -p faulthandler -o faulthandler_timeout=600
